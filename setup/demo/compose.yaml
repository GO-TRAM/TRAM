# Logs, metrics and traces from OTLP clients flow through Tram into OpenObserve and
# show up in Grafana. See README.md in this directory.
#
#   docker compose up -d --build     (or: task demo:up)
#   open http://localhost:3000       (Grafana)
#   open http://localhost:5080       (OpenObserve, root@example.com / Complexpass#123)

name: tram-demo

services:
  tram:
    build:
      context: ../..
    image: tram:demo
    # The stream comes from config/otlp_to_openobserve.json through the file
    # sync. It sends logs and metrics down separate branches, each with its
    # own filter, to OpenObserve.
    command:
      - server
      - --http-endpoint=0.0.0.0:8080
      - --grpc-endpoint=0.0.0.0:50051
      - --enable-file-sync
      - --config-directory=/config
    volumes:
      # Read-only: the file sync only writes files for streams changed
      # through the API, which this demo does not need.
      - ./config:/config:ro
    ports:
      - "8080:8080" # Tram HTTP API
      - "4318:4318" # OTLP/HTTP source of the stream, to send your own data
    depends_on:
      - openobserve

  # Sends INFO logs of a "checkout" service, which reach OpenObserve.
  checkout:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - logs
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="checkout"
      - --otlp-attributes=deployment.environment="demo"
      - --telemetry-attributes=order.status="paid"
      - --severity-text=INFO
      - --severity-number=9
      - --body=Order paid
      - --rate=1
      - --workers=5
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  # Sends DEBUG logs, which the "logs" cel_filter stage in Tram drops.
  debug-noise:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - logs
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="debug-noise"
      - --severity-text=DEBUG
      - --severity-number=5
      - --body=Cache lookup
      - --rate=5
      - --workers=50
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  # Sends the counter checkout.orders, which reaches OpenObserve.
  checkout-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - metrics
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="checkout"
      - --otlp-attributes=deployment.environment="demo"
      - --telemetry-attributes=order.status="paid"
      - --otlp-metric-name=checkout.orders
      - --metric-type=Sum
      - --aggregation-temporality=cumulative
      - --rate=1
      - --workers=1
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  # Sends the gauge debug.cache.size, which the "metrics" cel_filter stage in
  # Tram drops like every metric whose name starts with "debug.".
  debug-noise-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - metrics
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="debug-noise"
      - --otlp-metric-name=debug.cache.size
      - --metric-type=Gauge
      - --rate=5
      - --workers=1
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  # Sends traces of a "checkout" service, each with a root span and two child
  # spans, which reach OpenObserve.
  checkout-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - traces
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="checkout"
      - --otlp-attributes=deployment.environment="demo"
      - --telemetry-attributes=order.status="paid"
      - --child-spans=2
      - --span-duration=50ms
      - --rate=1
      - --workers=1
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  # Sends traces of the "debug-noise" service, which the "traces" cel_filter
  # stage in Tram drops.
  debug-noise-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      - traces
      - --otlp-http
      - --otlp-endpoint=tram:4318
      - --otlp-insecure
      - --otlp-attributes=service.name="debug-noise"
      - --child-spans=1
      - --span-duration=5ms
      - --rate=5
      - --workers=1
      - --duration=24h
      - --batch=false
    depends_on:
      - tram
    restart: on-failure

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    environment:
      # Fixed credentials for a local demo only. Tram's sinks in
      # config/otlp_to_openobserve.json and Grafana's datasources use them.
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080" # OpenObserve UI and API

  grafana:
    # Grafana with the OpenObserve plugin, see grafana/Dockerfile.
    build:
      context: ./grafana
    image: grafana:tram-demo
    environment:
      # Open Grafana without logging in; fine for a local demo only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The OpenObserve plugin is not signed.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: openobserve
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/tram-logs.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - openobserve
