# Single-binary Loki that keeps everything on its local disk. It accepts OTLP
# logs on /otlp/v1/logs; resource attributes like service.name become labels
# (service_name), the others structured metadata.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Needed for OTLP: log attributes are stored as structured metadata.
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
