apiVersion: 1

# All datasources read from OpenObserve, logged in as the root user from
# compose.yaml.
datasources:
  # Logs, queried with SQL through the OpenObserve plugin.
  - name: OpenObserve
    type: openobserve
    uid: openobserve
    access: proxy
    url: http://openobserve:5080
    basicAuth: true
    basicAuthUser: root@example.com
    secureJsonData:
      basicAuthPassword: Complexpass#123
    jsonData:
      timestamp_column: _timestamp
    isDefault: true
    editable: false

  # Metrics, queried with PromQL through OpenObserve's Prometheus API.
  - name: OpenObserve Metrics
    type: prometheus
    uid: openobserve-metrics
    access: proxy
    url: http://openobserve:5080/api/default/prometheus
    basicAuth: true
    basicAuthUser: root@example.com
    secureJsonData:
      basicAuthPassword: Complexpass#123
    editable: false

  # Log lines and traces, queried with SQL through OpenObserve's search API
  # with the Infinity plugin. The OpenObserve plugin cannot query traces, and
  # in dashboards it only returns aggregations, not log lines.
  - name: OpenObserve SQL
    type: yesoreyeram-infinity-datasource
    uid: openobserve-sql
    url: http://openobserve:5080/api/default
    basicAuth: true
    basicAuthUser: root@example.com
    secureJsonData:
      basicAuthPassword: Complexpass#123
    jsonData:
      auth_method: basicAuth
      allowedHosts:
        - http://openobserve:5080
    editable: false
