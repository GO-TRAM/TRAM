# otlp_insecure_dev.yaml - Development configuration with insecure TLS
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp_insecure_dev
spec:
  source:
    type: generator
    name: event_generator
    spec:
      interval: "1s"
  stages: []
  sinks:
    - type: otlp
      name: dev_otlp_sink
      from: event_generator
      spec:
        url: "https://localhost:4318"
        insecure: true
        timeout: "5s"
        headers:
          X-Development: "true"
          X-Service: "test-service"