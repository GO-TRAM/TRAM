# otlp_debug.yaml - OTLP to the debug sink, which logs every record it receives
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp-debug
spec:
  engineRefs:
    - name: demo
  source:
    type: otlp
    name: otlp_source
    spec:
      http_port: 4327
  stages: []
  sinks:
    - type: debug
      name: out
      from: otlp_source
