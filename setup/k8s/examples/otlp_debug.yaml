# otlp_basic.yaml - Basic OTLP to OTLP forwarding
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp-debug
spec:
  engineRefs:
    - name: demo
  source:
    type: otlp
    name: otlp_source
    spec:
      http_port: 4318
  stages: []
  sinks:
    - type: debug
      name: out
      from: otlp_source