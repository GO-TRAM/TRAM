# test-stream.yaml
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: test-stream
spec:
  source:
    type: generator
    name: generator
    spec:
      interval: 2s
  stages:
    - type: delay
      name: delay
      from: generator
      spec:
        delay: 1s
  sinks:
    - type: debug
      name: debug
      from: delay
