---
apiVersion: v1
kind: Namespace
metadata:
  name: tram-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tram-manager
  namespace: tram-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tram-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tram-manager
subjects:
  - kind: ServiceAccount
    name: tram-manager
    namespace: tram-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tram-manager
  namespace: tram-system
  labels:
    app.kubernetes.io/name: tram-manager
spec:
  replicas: 2 # one leader works at a time, the other takes over
  selector:
    matchLabels:
      app.kubernetes.io/name: tram-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tram-manager
    spec:
      serviceAccountName: tram-manager
      containers:
        - name: manager
          image: tram:dev
          args:
            - manager
            - --engine-image=tram:dev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
