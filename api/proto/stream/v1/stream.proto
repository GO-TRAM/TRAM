syntax = "proto3";
package api.proto.stream.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "codeberg.org/eljoth/tram/pkg/gen/go/api/proto/stream/v1";

//------------------------------------------------------------------------------
// Domain definitions
//------------------------------------------------------------------------------

message Source {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Struct spec = 3;
}

message Stage {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string from = 3;
  google.protobuf.Struct spec = 4;
}

message Sink {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string from = 3;
  google.protobuf.Struct spec = 4;
}

// Enables a metric per kind of node. Unset fields keep their defaults.
message NodeMetrics {
  // Defaults to true.
  optional bool source = 1;
  // Defaults to false.
  optional bool stages = 2;
  // Defaults to true.
  optional bool sinks = 3;
}

// Chooses the metrics a stream records. Unset fields keep their defaults.
message Metrics {
  // tram.node.records and tram.node.records.out.
  NodeMetrics records = 1;
  // tram.node.duration.
  NodeMetrics duration = 2;
  // tram.source.request.size. Defaults to true.
  optional bool request_size = 3;
}

message Stream {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Source source = 2;
  repeated Stage stages = 3;
  repeated Sink sinks = 4 [(buf.validate.field).repeated.min_items = 1];
  Metrics metrics = 5;
}

//------------------------------------------------------------------------------
// Payload definitions
//------------------------------------------------------------------------------

message PutStreamRequest {
  Stream stream = 1;
}

message PutStreamResponse {
  Stream stream = 1;
}

message GetStreamRequest {
  string name = 1;
}

message GetStreamResponse {
  Stream stream = 1;
}

message DeleteStreamRequest {
  string name = 1;
}

message DeleteStreamResponse {}

message ListStreamsRequest {}

message ListStreamsResponse {
  // All streams, ordered by name.
  repeated Stream streams = 1;
}

service StreamService {
  rpc PutStream(PutStreamRequest) returns (PutStreamResponse) {
    option (google.api.http) = {
      put: "/v1/streams/{stream.name}"
      body: "*"
    };
  }
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse) {
    option (google.api.http) = {get: "/v1/streams/{name}"};
  }
  rpc DeleteStream(DeleteStreamRequest) returns (DeleteStreamResponse) {
    option (google.api.http) = {delete: "/v1/streams/{name}"};
  }
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {
    option (google.api.http) = {get: "/v1/streams"};
  }
}
