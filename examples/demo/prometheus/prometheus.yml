# Prometheus runs in agent mode: it scrapes Tram's own metrics and forwards
# them to OpenObserve, without storing or querying them itself. OpenObserve
# cannot scrape, and Tram's metrics should not depend on Tram's streams.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: tram
    static_configs:
      - targets: ["tram:8080"]

remote_write:
  - url: http://openobserve:5080/api/default/prometheus/api/v1/write
    basic_auth:
      username: root@example.com
      password: Complexpass#123
