# otlp_secure.yaml - Secure OTLP forwarding with authentication
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp-secure
spec:
  engineRefs:
    - name: demo
  source:
    type: otlp
    name: otlp_source
    spec:
      http_port: 4321
  stages: []
  sinks:
    - type: otlp
      name: Secure_OTLP_Sink
      from: otlp_source
      spec:
        url: "https://telemetry-collector.example.com:443"
        timeout: "10s"
        headers:
          Authorization: "Bearer your-api-token-here"
          Content-Type: "application/protobuf"
          X-Environment: "production"
