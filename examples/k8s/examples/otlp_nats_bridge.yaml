# otlp_nats_bridge.yaml - Bridges NATS JetStream to OTLP HTTP
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp-nats-bridge
spec:
  engineRefs:
    - name: demo
  source:
    type: broker
    name: nats
    spec:
      driver: nats
      signal: logs
      workers: 4
      nats:
        url: "nats://nats-server:4222"
        subject: "telemetry.*"
        stream: input-stream
        durable: tram-otlp-bridge
  stages:
    - type: batch
      name: batch
      from: nats
      spec:
        max_records: 2000
        timeout: 1s
  sinks:
    - type: otlp
      name: otlp_sink
      from: batch
      spec:
        url: "http://central-telemetry:4318"
        timeout: 30s
        headers:
          X-Bridge: nats-to-otlp
          X-Source-Stream: input-stream
