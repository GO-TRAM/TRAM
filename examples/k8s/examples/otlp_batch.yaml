# otlp_batch.yaml - High-throughput OTLP forwarding with batching
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: otlp-batch
spec:
  engineRefs:
    - name: demo
  source:
    type: otlp
    name: otlp
    spec:
      http_port: 4319
  stages:
    - type: batch
      name: batch
      from: otlp
      spec:
        max_records: 1000
        timeout: "200ms"
  sinks:
    - type: otlp
      name: otlp_sink
      from: batch
      spec:
        url: "http://telemetry-collector:4318"
        timeout: "30s"
