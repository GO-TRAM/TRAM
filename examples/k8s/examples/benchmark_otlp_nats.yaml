# benchmark_otlp_nats.yaml - OTLP to NATS benchmark configuration
# Matches the otlp-nats scenario from BENCHMARK.md: OTLP → NATS
apiVersion: io.tram.core/v1
kind: Stream
metadata:
  name: benchmark-otlp-nats
spec:
  engineRefs:
    - name: demo
  source:
    type: otlp
    name: otlp_source
    spec:
      http_port: 4324
  stages: []
  sinks:
    - type: broker
      name: nats_sink
      from: otlp_source
      spec:
        driver: nats
        nats:
          url: "nats://nats-server:4222"
        destination:
          logs: "'benchmark.' + logs.resource_logs[0].resource.attributes.get_attr('service.name')"
          metrics: "'benchmark.' + metrics.resource_metrics[0].resource.attributes.get_attr('service.name')"
          traces: "'benchmark.' + traces.resource_spans[0].resource.attributes.get_attr('service.name')"
