site_name: Tram
site_description: A lightweight, extensible pipeline framework for logs, metrics and traces
site_url: https://gotram.dev/
repo_url: https://codeberg.org/eljoth/tram
repo_name: eljoth/tram
edit_uri: ""
copyright: Licensed under the Mozilla Public License 2.0

# Pages written for the site only. The guide, components, operator, benchmark
# and contributing pages are generated from the Markdown files of the
# repository by hooks.py, the images come from docs/assets/.
docs_dir: content
site_dir: ../site

hooks:
  - hooks.py

# Lets `mkdocs serve` reload when the documents the hook reads change.
# MkDocs keeps hooks loaded, so restart it after changing hooks.py.
watch:
  - assets
  - ../README.md
  - ../COMPONENTS.md
  - ../BENCHMARK.md
  - ../CONTRIBUTING.md
  - ../internal/adapters/k8scrd/README.md

theme:
  name: material
  logo: assets/colored-logo.svg
  favicon: assets/colored-logo.svg
  icon:
    repo: simple/codeberg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: simple/codeberg
      link: https://codeberg.org/eljoth/tram
      name: Tram on Codeberg

nav:
  - Home: index.md
  - Guide:
      - guide/getting-started.md
      - guide/pipelines.md
      - guide/api.md
      - guide/configuration.md
      - guide/metrics.md
      - guide/security.md
  - Components:
      - components/index.md
      - components/sources.md
      - components/stages.md
      - components/sinks.md
  - Kubernetes: kubernetes.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  links:
    anchors: warn
