# Zensical configuration. The site is built with `zensical build -f
# docs/zensical.toml` after `python docs/generate.py` generated the guide,
# components, operator, benchmark and contributing pages in content/ from
# the Markdown files of the repository; the images come from assets/.

[project]
site_name = "TRAM"
site_description = "A lightweight, extensible pipeline framework for logs, metrics and traces"
site_url = "https://gotram.dev/"
repo_url = "https://codeberg.org/eljoth/tram"
repo_name = "eljoth/tram"
copyright = "Licensed under the Mozilla Public License 2.0"

docs_dir = "content"
site_dir = "site"

# Lets `zensical serve` rebuild when the documents generate.py reads change.
# The generated pages themselves only change when generate.py runs again.
watch = [
  "assets",
  "../README.md",
  "../COMPONENTS.md",
  "../BENCHMARK.md",
  "../CONTRIBUTING.md",
  "../internal/adapters/k8scrd/README.md",
]

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
      { "Getting Started" = "guide/getting-started.md" },
      { "Streams" = "guide/streams.md" },
      { "HTTP API" = "guide/api.md" },
      { "Configuration Sources" = "guide/configuration.md" },
      { "Metrics" = "guide/metrics.md" },
      { "Security" = "guide/security.md" },
  ] },
  { "Components" = [
      { "Overview" = "components/index.md" },
      { "Sources" = "components/sources.md" },
      { "Stages" = "components/stages.md" },
      { "Sinks" = "components/sinks.md" },
  ] },
  { "Kubernetes" = "kubernetes.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "Contributing" = "contributing.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/colored-logo.svg"
favicon = "assets/colored-logo.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.theme.icon]
repo = "simple/codeberg"

[[project.extra.social]]
icon = "fontawesome/brands/codeberg"
link = "https://codeberg.org/eljoth/tram"
name = "TRAM on Codeberg"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

[project.validation.links]
anchors = "warn"
