version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /examples/demo/grafana
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-dependencies:
        patterns: ["*"]
