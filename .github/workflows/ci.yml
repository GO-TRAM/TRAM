# Validates pull requests and pushes to main with golangci-lint (`task ci:lint`)
# and unit and end-to-end tests (`task ci:test`), as two parallel jobs. The container tests (NATS, Kafka, AMQP) skip
# themselves without a container runtime; run them locally with
# `task test:containers`.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Lint and tests run as parallel jobs, each within the runner's time limit.
    strategy:
      matrix:
        target: [lint, test]
    container:
      image: docker.io/library/golang:1.27
    env:
      # Canonical repository path
      REPO: eljoth/tram
      TASK_VERSION: v3.54.0
    steps:
      - name: Check out
        run: |
          git init --quiet src
          cd src
          git remote add origin "https://${GITHUB_TOKEN}@github.com/${REPO}.git"
          # Fetching the commit directly is enough for a branch push; pull
          # request heads, e.g. from forks, are only reachable through their
          # refs/pull/ ref.
          git fetch --quiet --depth 1 origin "${GITHUB_SHA}" \
            || git fetch --quiet origin "+refs/pull/*/head:refs/remotes/pull/*" "+refs/heads/*:refs/remotes/origin/*"
          git checkout --quiet --detach "${GITHUB_SHA}"
          git log --oneline -1

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Check
        working-directory: src
        run: task ci:${{ matrix.target }}
